<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng Dẫn Getkey Script - ronnei7.htk</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Plyr Video Player CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root {
            --bg-main: #0a0b0e;
            --card-bg: #12141c;
            --card-border: #222634;
            --accent-green: #00e676;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --plyr-color-main: #00e676;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 8px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.1) 0%, transparent 70%),
                radial-gradient(circle at 50% 100%, rgba(15, 23, 42, 0.8) 0%, transparent 60%);
        }

        .wrapper {
            width: 100%;
            max-width: 680px; /* Phóng to kích thước tổng thể khung */
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .header-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: var(--accent-green);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }

        .title {
            font-size: 26px; /* Chữ to hơn */
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 18px;
            font-weight: 500;
        }

        .stats-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #181c27;
            border: 1px solid #2a3042;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 20px;
        }

        .pulse-dot {
            width: 9px;
            height: 9px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 230, 118, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }

        .video-container {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 18px;
            background: #000000;
            width: 100%;
        }

        .footer-note {
            font-size: 13px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Plyr Video Player Custom Size */
        .plyr--full-ui {
            border-radius: 16px;
        }
        .plyr__control--overlaid {
            background: var(--accent-green) !important;
            color: #000000 !important;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            
            <!-- Đổi tên thành tiktok: ronnei7.htk -->
            <div class="header-tag">
                <i class="fa-brands fa-tiktok"></i> tiktok: ronnei7.htk
            </div>

            <h1 class="title">Hướng Dẫn Getkey Script</h1>
            <p class="subtitle">Guide to getting the script key quickly & easily</p>

            <!-- Số lượt truy cập tăng liên tục -->
            <div class="stats-badge">
                <span class="pulse-dot"></span>
                <span>Số lượt truy cập: <span id="visit-count" style="color: var(--accent-green);">10,006</span></span>
            </div>

            <!-- Video Player Phóng To -->
            <div class="video-container">
                <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="_8UGKIQwH0o"></div>
            </div>

            <div class="footer-note">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Xem kỹ hướng dẫn từng bước trong video để lấy key vĩnh viễn</span>
            </div>

        </div>
    </div>

    <!-- Plyr JavaScript -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // Khởi tạo Player Video
        const player = new Plyr('#player', {
            controls: [
                'play-large', 
                'play', 
                'progress', 
                'current-time', 
                'duration', 
                'mute', 
                'volume', 
                'settings', 
                'fullscreen'
            ],
            youtube: {
                noCookie: true,
                rel: 0,
                showinfo: 0,
                iv_load_policy: 3,
                modestbranding: 1
            }
        });

        // Script tăng lượt truy cập tự động kiểu ảo như thật (Tăng 3 - 4 lượt mỗi 1 - 2.5 giây)
        let visits = parseInt(localStorage.getItem('syscall_visits')) || 10006;
        const countElement = document.getElementById('visit-count');

        function updateVisitCount() {
            countElement.innerText = visits.toLocaleString('vi-VN');
        }

        updateVisitCount();

        function autoIncrementVisits() {
            // Ngẫu nhiên cộng thêm 3 hoặc 4 người
            const addPeople = Math.floor(Math.random() * 2) + 3; 
            visits += addPeople;
            localStorage.setItem('syscall_visits', visits);
            updateVisitCount();

            // Thời gian chờ ngẫu nhiên giữa các lần tăng (1s đến 2.5s)
            const randomTime = Math.floor(Math.random() * 1500) + 1000;
            setTimeout(autoIncrementVisits, randomTime);
        }

        // Kích hoạt tăng lượt xem liên tục
        setTimeout(autoIncrementVisits, 1200);
    </script>
</body>
</html>
